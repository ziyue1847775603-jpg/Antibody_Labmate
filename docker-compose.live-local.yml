# Antibody Labmate — Live Local Docker Compose (Phase D1/D3/D4)
#
# This file is separate from docker-compose.yml (Replay-only).
# It adds:
#   - lightdock:  LightDock 0.9.4 CPU worker (Phase D1, verified)
#   - colabfold:  ColabFold 1.6.2 GPU worker (Phase D3, verified)
#
# Both workers communicate with Labmate solely through fixed CLI
# commands and shared work volumes.
#
# Required environment variables (set by the Labmate adapters; the :?
# syntax fails closed if unset):
#   LABMATE_DOCKER_WORK_ROOT        host dir for /work mounts
#   LABMATE_COLABFOLD_DATA_ROOT     host dir with model weights -> /models/colabfold (ro)
#   LABMATE_COLABFOLD_CACHE_ROOT    host dir for JAX compilation cache -> /work/cache (rw)
#
# Usage:
#   $ docker compose -f docker-compose.live-local.yml build
#   $ docker compose -f docker-compose.live-local.yml run --rm lightdock version
#   $ docker compose -f docker-compose.live-local.yml run --rm colabfold version
#   $ docker compose -f docker-compose.live-local.yml run --rm colabfold gpu-check

services:
  colabfold:
    build:
      context: ./docker/live/colabfold
      dockerfile: Dockerfile
    image: antibody-labmate-colabfold:1.6.2
    # No public ports — invoked on-demand via `docker compose run`
    volumes:
      # Input FASTA: read-only
      - ${LABMATE_DOCKER_WORK_ROOT:?LABMATE_DOCKER_WORK_ROOT is required}/input:/work/input:ro
      # Prediction output: read-write
      - ${LABMATE_DOCKER_WORK_ROOT:?LABMATE_DOCKER_WORK_ROOT is required}/output:/work/output:rw
      # Model weights: read-only, user-supplied
      - ${LABMATE_COLABFOLD_DATA_ROOT:?LABMATE_COLABFOLD_DATA_ROOT is required}:/models/colabfold:ro
      # JAX compilation cache: read-write, user-supplied
      - ${LABMATE_COLABFOLD_CACHE_ROOT:?LABMATE_COLABFOLD_CACHE_ROOT is required}:/work/cache:rw
    # GPU is granted ONLY to this service
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: '8'
          memory: 16G
    # No privileged mode, no Docker socket mount, no host network
    privileged: false
    # single_sequence mode needs no network at all
    network_mode: none
    # Read-only root filesystem; /tmp (tmpfs), /work/output and /work/cache (volumes) writable
    read_only: true
    tmpfs:
      - /tmp:size=4G,mode=1777
    # Explicitly drop all capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    stdin_open: false
    tty: false

  lightdock:
    build:
      context: ./docker/live/lightdock
      dockerfile: Dockerfile
    image: antibody-labmate-lightdock:0.9.4
    # No public ports — invoked on-demand via `docker compose run`
    volumes:
      # Shared work directory with explicit sub-directories.
      # Both are read-write because LightDock's setup step writes
      # processed PDBs back into the inputs directory.
      #   ${LABMATE_DOCKER_WORK_ROOT}/inputs  -> /work/inputs  (read-write)
      #   ${LABMATE_DOCKER_WORK_ROOT}/outputs -> /work/outputs (read-write)
      #
      # The :? syntax causes docker compose to fail with a clear message
      # if the variable is unset or empty -- no silent fallback.
      - ${LABMATE_DOCKER_WORK_ROOT:?LABMATE_DOCKER_WORK_ROOT is required}/inputs:/work/inputs:rw
      - ${LABMATE_DOCKER_WORK_ROOT:?LABMATE_DOCKER_WORK_ROOT is required}/outputs:/work/outputs:rw
    # CPU-only worker; no GPU reservation
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    # No privileged mode, no Docker socket mount, no host network
    privileged: false
    # Explicitly drop all capabilities
    cap_drop:
      - ALL
    # Read-only root filesystem; /tmp (tmpfs), /work/inputs (rw volume),
    # and /work/outputs (rw volume) are explicit writable mounts.
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    # No automatic restart -- invoked on-demand via `docker compose run`
    restart: "no"
    # Security options
    security_opt:
      - no-new-privileges:true
    stdin_open: false
    tty: false
