[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antibody-labmate"
version = "0.4.0"
description = "Auditable Replay and local antibody-to-docking workflow"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Antibody Labmate contributors" }]
dependencies = [
  "Jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.scripts]
labmate = "labmate.cli:main"

[tool.setuptools.packages.find]
include = ["labmate*"]

[tool.setuptools.package-data]
labmate = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests that require a running Docker daemon with built images",
]
